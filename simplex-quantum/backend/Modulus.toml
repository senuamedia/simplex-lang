# Simplex Quantum Backend Abstraction Layer
# Phase 2: Multi-provider backend interface for quantum circuit execution
#
# Provides a unified interface for submitting quantum circuits to cloud
# providers (Amazon Braket, IBM Quantum, Azure Quantum) and a local
# statevector simulator for testing and development.

[package]
name = "simplex-quantum-backend"
version = "0.17.0"
description = "Quantum backend abstraction -- cloud providers and local simulator"
authors = ["Rod Higgins"]
license = "AGPL-3.0"

[dependencies]
simplex-std = { path = "../../simplex-std" }
simplex-quantum = { path = ".." }
