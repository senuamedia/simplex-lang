[package]
name = "simplex-vectordb"
version = "0.16.0"
description = "Vector database with HNSW indexing for Simplex hive intelligence"
authors = ["Rod Higgins", "Simplex Team"]
license = "AGPL-3.0"
repository = "https://github.com/anthropics/simplex-lang"

[dependencies]
simplex-std = { path = "../simplex-std" }

[features]
default = ["full"]
full = ["flat", "hnsw", "persist"]
flat = []       # Brute-force exact search
hnsw = []       # Hierarchical Navigable Small World graphs
persist = []    # Serialize/deserialize index to disk
