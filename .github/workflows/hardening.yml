name: Production Hardening

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  fuzz-regression:
    name: Fuzz Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libssl-dev

      - name: Bootstrap compiler
        run: |
          cd compiler/bootstrap
          for mod in lexer parser error codegen main; do
            python3 stage0.py $mod.sx > $mod.ll
          done

      - name: Merge LLVM IR
        run: python3 compiler/bootstrap/stage0.py --merge compiler/bootstrap/*.ll > compiler/bootstrap/sxc_combined.ll

      - name: Build sxc
        run: |
          clang -O2 compiler/bootstrap/sxc_combined.ll runtime/standalone_runtime.c \
            -o build/sxc -lm -lssl -lcrypto -lpthread

      - name: Run fuzz targets
        run: |
          chmod +x scripts/run-fuzz.sh
          scripts/run-fuzz.sh 30
        timeout-minutes: 10

  sanitizer-sweep:
    name: Sanitizer Sweep
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libssl-dev

      - name: Bootstrap compiler
        run: |
          cd compiler/bootstrap
          for mod in lexer parser error codegen main; do
            python3 stage0.py $mod.sx > $mod.ll
          done

      - name: Merge and build
        run: |
          python3 compiler/bootstrap/stage0.py --merge compiler/bootstrap/*.ll > compiler/bootstrap/sxc_combined.ll
          clang -O2 compiler/bootstrap/sxc_combined.ll runtime/standalone_runtime.c \
            -o build/sxc -lm -lssl -lcrypto -lpthread

      - name: Run sanitizer sweep
        run: |
          chmod +x scripts/run-sanitizers.sh
          scripts/run-sanitizers.sh "${{ matrix.sanitizer }}"
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1

  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libssl-dev

      - name: Bootstrap compiler
        run: |
          cd compiler/bootstrap
          for mod in lexer parser error codegen main; do
            python3 stage0.py $mod.sx > $mod.ll
          done

      - name: Merge and build
        run: |
          python3 compiler/bootstrap/stage0.py --merge compiler/bootstrap/*.ll > compiler/bootstrap/sxc_combined.ll
          clang -O2 compiler/bootstrap/sxc_combined.ll runtime/standalone_runtime.c \
            -o build/sxc -lm -lssl -lcrypto -lpthread

      - name: Run property tests
        run: |
          cd tests
          for prop in properties/prop_*.sx; do
            echo "=== Testing $prop ==="
            ../build/sxc build "$prop" > /tmp/prop_test.ll 2>/dev/null || \
              python3 ../compiler/bootstrap/stage0.py "$prop" > /tmp/prop_test.ll
            clang -O1 /tmp/prop_test.ll ../runtime/standalone_runtime.c \
              -o /tmp/prop_test.bin -lm -lssl -lcrypto -lpthread
            /tmp/prop_test.bin
            echo ""
          done
        continue-on-error: true

  formal-invariants:
    name: Formal Invariant Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libssl-dev

      - name: Bootstrap and build
        run: |
          cd compiler/bootstrap
          for mod in lexer parser error codegen main; do
            python3 stage0.py $mod.sx > $mod.ll
          done
          cd ../..
          python3 compiler/bootstrap/stage0.py --merge compiler/bootstrap/*.ll > compiler/bootstrap/sxc_combined.ll
          clang -O2 compiler/bootstrap/sxc_combined.ll runtime/standalone_runtime.c \
            -o build/sxc -lm -lssl -lcrypto -lpthread

      - name: Run formal invariant tests
        run: |
          cd tests
          for inv in formal/invariant_*.sx; do
            echo "=== Checking $inv ==="
            ../build/sxc build "$inv" > /tmp/inv_test.ll 2>/dev/null || \
              python3 ../compiler/bootstrap/stage0.py "$inv" > /tmp/inv_test.ll
            clang -O1 /tmp/inv_test.ll ../runtime/standalone_runtime.c \
              -o /tmp/inv_test.bin -lm -lssl -lcrypto -lpthread
            /tmp/inv_test.bin
            echo ""
          done
        continue-on-error: true
