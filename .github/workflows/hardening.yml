name: Production Hardening

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  fuzz-regression:
    name: Fuzz Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libssl-dev

      - name: Build compiler
        run: |
          mkdir -p build
          bash build.sh

      - name: Run fuzz targets
        run: |
          chmod +x scripts/run-fuzz.sh
          scripts/run-fuzz.sh 30
        timeout-minutes: 10
        continue-on-error: true

  sanitizer-sweep:
    name: Sanitizer Sweep
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libssl-dev

      - name: Build compiler
        run: |
          mkdir -p build
          bash build.sh

      - name: Run sanitizer sweep
        run: |
          chmod +x scripts/run-sanitizers.sh
          scripts/run-sanitizers.sh "${{ matrix.sanitizer }}"
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        continue-on-error: true

  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libssl-dev

      - name: Build compiler
        run: |
          mkdir -p build
          bash build.sh

      - name: Run property tests
        run: |
          cd tests
          for prop in properties/prop_*.sx; do
            if [ ! -f "$prop" ]; then continue; fi
            echo "=== Testing $prop ==="
            ../build/sxc build "$prop" 2>/dev/null
            test_name=$(basename "$prop" .sx)
            if [ -f "${test_name}.ll" ]; then
              clang -O1 "${test_name}.ll" ../runtime/standalone_runtime.c \
                -o "/tmp/${test_name}.bin" -lm -lssl -lcrypto -lpthread 2>/dev/null && \
              "/tmp/${test_name}.bin" && echo "PASS" || echo "FAIL"
              rm -f "${test_name}.ll" "/tmp/${test_name}.bin"
            else
              echo "SKIP: no .ll generated"
            fi
            echo ""
          done
        continue-on-error: true

  formal-invariants:
    name: Formal Invariant Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libssl-dev

      - name: Build compiler
        run: |
          mkdir -p build
          bash build.sh

      - name: Run formal invariant tests
        run: |
          cd tests
          for inv in formal/invariant_*.sx; do
            if [ ! -f "$inv" ]; then continue; fi
            echo "=== Checking $inv ==="
            ../build/sxc build "$inv" 2>/dev/null
            test_name=$(basename "$inv" .sx)
            if [ -f "${test_name}.ll" ]; then
              clang -O1 "${test_name}.ll" ../runtime/standalone_runtime.c \
                -o "/tmp/${test_name}.bin" -lm -lssl -lcrypto -lpthread 2>/dev/null && \
              "/tmp/${test_name}.bin" && echo "PASS" || echo "FAIL"
              rm -f "${test_name}.ll" "/tmp/${test_name}.bin"
            else
              echo "SKIP: no .ll generated"
            fi
            echo ""
          done
        continue-on-error: true
