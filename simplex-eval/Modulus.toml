[package]
name = "simplex-eval"
version = "0.16.0"
description = "Evaluation suites and metrics for Simplex hive intelligence"
authors = ["Rod Higgins", "Simplex Team"]
license = "AGPL-3.0"
repository = "https://github.com/anthropics/simplex-lang"

[dependencies]
simplex-std = { path = "../simplex-std" }

[features]
default = ["full"]
full = ["suite", "metrics", "report"]
suite = []      # Evaluation suite management
metrics = []    # Evaluation metrics (exact match, BLEU, Levenshtein)
report = []     # Report formatting
